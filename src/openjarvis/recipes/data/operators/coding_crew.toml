[operator]
name = "coding_crew"
version = "0.1.0"
description = "Picks GitHub issues labelled agent-ready and has a coding agent solve each one in a disposable container, ending in a draft pull request for a person to review"
metrics = ["issues_attempted", "pull_requests_opened"]

[operator.agent]
max_turns = 6
temperature = 0.0
tools = ["coding_crew_queue", "coding_crew_run", "memory_store", "memory_retrieve", "think"]
system_prompt_path = "coding_crew_prompt.md"

[operator.schedule]
type = "interval"
value = "900"
